name: NearMint Card Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: nearmint-tracker
  cancel-in-progress: true

jobs:
  tracker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run NearMint tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python nearmint_alert.py

      - name: Save seen cards
        if: success()
        run: |

          git config user.name "NearMint Tracker"
          git config user.email "actions@github.com"

          git add seen_cards.json

          if git diff --cached --quiet; then
            echo "No changes to seen_cards.json"
          else
            git commit -m "Update seen cards"
            git push
          fi
